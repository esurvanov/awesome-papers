[project]
name = "awesome-papers"
version = "0.1.0"
description = "Ролики по научным статьям: ядро (ManimGL, паспорт ролика, проверки, сборка с голосом) и папка на каждую статью"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manimgl",
    "setuptools<81",
    "numpy",
    "scipy",
    "ruaccent",    # ударения и ё для озвучки (core/pipeline/voice.py)
    "websockets",  # живая модель OpenAI по websocket
    "torch",       # локальный русский голос Silero (core/pipeline/voice.py)
    "soundfile",
    "omegaconf",
]

[tool.uv]
package = false

# Форк исходников ManimGL лежит в репозитории, правки в нём действуют сразу
[tool.uv.sources]
manimgl = { path = "vendor/manim", editable = true }
