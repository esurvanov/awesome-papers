<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 336" width="1080" height="336" role="img" aria-label="From a paper to a film" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" lang="en">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="336" rx="14" fill="#0f172a"/>
<text x="540.0" y="36" font-size="22" fill="#e2e8f0" text-anchor="middle" font-weight="700">From a paper to a film</text>
<rect x="24" y="64" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="36" y="84" font-size="13" fill="#60a5fa" font-weight="700">1</text>
<text x="116.0" y="110" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Paper</text>
<text x="116.0" y="134" font-size="13" fill="#94a3b8" text-anchor="middle">pick, read, passport</text>
<rect x="236" y="64" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="248" y="84" font-size="13" fill="#60a5fa" font-weight="700">2</text>
<text x="328.0" y="110" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Retelling</text>
<text x="328.0" y="134" font-size="13" fill="#94a3b8" text-anchor="middle">three sentences a friend</text>
<text x="328.0" y="150" font-size="13" fill="#94a3b8" text-anchor="middle">can repeat</text>
<rect x="448" y="64" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="460" y="84" font-size="13" fill="#60a5fa" font-weight="700">3</text>
<text x="540.0" y="110" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Narration</text>
<text x="540.0" y="134" font-size="13" fill="#94a3b8" text-anchor="middle">plain words, stress</text>
<text x="540.0" y="150" font-size="13" fill="#94a3b8" text-anchor="middle">marks</text>
<rect x="660" y="64" width="184" height="96" rx="10" fill="#5b3a0a" stroke="#fbbf24" stroke-width="2"/>
<text x="672" y="84" font-size="13" fill="#fbbf24" font-weight="700">4</text>
<text x="832" y="84" font-size="12" fill="#fbbf24" text-anchor="end">gate</text>
<text x="752.0" y="110" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Text check</text>
<text x="752.0" y="134" font-size="13" fill="#94a3b8" text-anchor="middle">stress, plain words,</text>
<text x="752.0" y="150" font-size="13" fill="#94a3b8" text-anchor="middle">read aloud</text>
<rect x="872" y="64" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="884" y="84" font-size="13" fill="#60a5fa" font-weight="700">5</text>
<text x="964.0" y="110" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Voice</text>
<text x="964.0" y="134" font-size="13" fill="#94a3b8" text-anchor="middle">speech model reads the</text>
<text x="964.0" y="150" font-size="13" fill="#94a3b8" text-anchor="middle">text</text>
<rect x="24" y="216" width="184" height="96" rx="10" fill="#5b3a0a" stroke="#fbbf24" stroke-width="2"/>
<text x="36" y="236" font-size="13" fill="#fbbf24" font-weight="700">6</text>
<text x="196" y="236" font-size="12" fill="#fbbf24" text-anchor="end">gate</text>
<text x="116.0" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Voice check</text>
<text x="116.0" y="286" font-size="13" fill="#94a3b8" text-anchor="middle">pitch falls at phrase</text>
<text x="116.0" y="302" font-size="13" fill="#94a3b8" text-anchor="middle">ends</text>
<rect x="236" y="216" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="248" y="236" font-size="13" fill="#60a5fa" font-weight="700">7</text>
<text x="328.0" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Storyboard</text>
<text x="328.0" y="286" font-size="13" fill="#94a3b8" text-anchor="middle">rough film, test viewer</text>
<rect x="448" y="216" width="184" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
<text x="460" y="236" font-size="13" fill="#60a5fa" font-weight="700">8</text>
<text x="540.0" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Scenes</text>
<text x="540.0" y="286" font-size="13" fill="#94a3b8" text-anchor="middle">one phrase = one frame</text>
<rect x="660" y="216" width="184" height="96" rx="10" fill="#5b3a0a" stroke="#fbbf24" stroke-width="2"/>
<text x="672" y="236" font-size="13" fill="#fbbf24" font-weight="700">9</text>
<text x="832" y="236" font-size="12" fill="#fbbf24" text-anchor="end">gate</text>
<text x="752.0" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Build check</text>
<text x="752.0" y="286" font-size="13" fill="#94a3b8" text-anchor="middle">late frames, overlaps</text>
<rect x="872" y="216" width="184" height="96" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
<text x="884" y="236" font-size="13" fill="#4ade80" font-weight="700">10</text>
<text x="964.0" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="700">Film</text>
<text x="964.0" y="286" font-size="13" fill="#94a3b8" text-anchor="middle">MP4 with voice</text>
<line x1="210" y1="112.0" x2="234" y2="112.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="422" y1="112.0" x2="446" y2="112.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="634" y1="112.0" x2="658" y2="112.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="846" y1="112.0" x2="870" y2="112.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<polyline points="964.0,162 964.0,188 116.0,188 116.0,214" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="210" y1="264.0" x2="234" y2="264.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="422" y1="264.0" x2="446" y2="264.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="634" y1="264.0" x2="658" y2="264.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="846" y1="264.0" x2="870" y2="264.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
